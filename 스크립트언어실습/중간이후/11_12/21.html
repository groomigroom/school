<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<p>이 코드에 대해서 서술하시오.</p>
<p></p>
<p class="dddd"></p>
<script>
    let x = 1, y = 2, z = 3, w = 4;
    y = x++;
    z += x;
    w = (x > 3) ? w - 3 : 3 - w;
    document.write(`x는 ${x}`);
    document.write(`y는 ${y}`);
    document.write(`z는 ${z}`);
    document.write(`w는 ${w}`);
</script>
</body>
</html>
