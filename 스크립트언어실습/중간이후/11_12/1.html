<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<p>이 코드의 동작 원리르를 서술하시오</p>
<p></p>
<script>
    let ii = 0;
    let n = Number(prompt("0보다 더 큰 정수 입력해"));
    let happppppp = 0;
    while (ii <= n) {
        happppppp += ii;
        ii++
    }
    document.querySelector("p").innerHTML = `${happppppp} 합`;
    console.log(happppppp);

</script>
</body>
</html>
