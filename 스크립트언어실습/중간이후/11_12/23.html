<body>
<p>이 코드에 대해서 서술하시오.</p>
<p></p>
<p class="dddd"></p>
<script>
    let a = 1, b = 2, c = 3, d = 4;
    let x = (a > 1) || (c != 3);
    let y = (a != b) && (c != d);
    let z = b << c;
    let w = (a == 1);
    x = x + x - x + x - x;
    y = y * y * y;
    z = x + y + z + z;
    w = w * 2 + 3 + 222 + w * w;
    document.write(`x는 ${x} `);
    document.write(`y는 ${y} `);
    document.write(`z는 ${z} `);
    document.write(`w는 ${w} `);
</script>
