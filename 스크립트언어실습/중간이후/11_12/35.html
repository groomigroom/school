<!doctype html>
<html lang="ko">

          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

<body>
<p>이 코드에 대해서 서술하시오.</p>
<h1 id="groomiiiii">구름이 멍멍</h1>
<script>
    // Date 객체 생성
    let today = new Date();
    // Date 객체의 toLocaleString() 메소드 호출
    document.write("현재 시간 : " + today.toLocaleString()
        + "<br>");
    // String 객체 생성
    let mystr = new String("JAVA spring boot 전자정부표준프레임워크 swing mysql 즐겁고 산뜻하게 공부하기");
    document.write("mystr의 내용 : " + mystr + "<br>");
    document.write("mystr의 길이 : " + mystr.length + "<br>");
</script>
</body>
</html>
